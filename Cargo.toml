[package]
name = "devd"
version = "0.4.0-alpha.1"
edition = "2021"
rust-version = "1.95"
description = "A lightweight local development service supervisor"
license = "MIT"
repository = "https://github.com/Ceng-0324/Devd"
readme = "README.md"
exclude = ["/TECHNICAL_DESIGN.md"]
keywords = ["development", "process", "supervisor", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Keep devd independent from any Cargo workspace declared by a parent directory.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
thiserror = "1"
tempfile = "3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["term"] }
vt100 = "0.16"
