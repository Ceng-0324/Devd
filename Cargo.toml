[package]
name = "devd"
version = "0.2.0-alpha.1"
edition = "2021"
description = "A lightweight local development service supervisor"
license = "MIT"
repository = "https://github.com/Ceng-0324/Devd"
readme = "README.md"
keywords = ["development", "process", "supervisor", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Keep devd independent from any Cargo workspace declared by a parent directory.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
thiserror = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
