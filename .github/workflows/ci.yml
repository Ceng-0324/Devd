name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify Cargo package
        # Keep extracted package sources out of rust-cache's target traversal.
        run: cargo package --locked --target-dir "$RUNNER_TEMP/devd-package"
      - name: Verify dependency licenses and registries
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny --locked check licenses sources
          python3 scripts/generate-third-party-notices.py --check

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked --all-targets
      - name: Check platform-specific code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate MVP fixture
        run: cargo run --locked -- check --config tests/fixtures/simple.yml
      - name: Validate configuration profiles
        run: |
          cargo run --locked -- check --config examples/profiles/devd.yml
          cargo run --locked -- check --config examples/profiles/devd.yml --profile dev
          cargo run --locked -- check --config examples/profiles/devd.yml --profile staging
          cargo run --locked -- check --config examples/profiles/devd.yml --profile prod
      - name: Install Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release verification and public package contents
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Exercise API, web and worker recovery
        run: python examples/local-stack/smoke.py --duration 5 --restarts 2
      - name: Exercise resource failure and retained incident evidence
        run: python scripts/incident-smoke.py
      - name: Exercise drift, reviewed recovery and transferred evidence
        run: python scripts/recovery-smoke.py
      - name: Install Node for MCP interoperability
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise official MCP Inspector interoperability
        run: python scripts/mcp-smoke.py
