name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Validate source revision
        env:
          DEVD_RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$DEVD_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'revision must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Record source revision
        env:
          DEVD_RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          git rev-parse HEAD > REVISION
          test "$(cat REVISION)" = "$DEVD_RELEASE_REVISION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive provenance and packaged binary recovery
        env:
          DEVD_RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py "$DEVD_RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: devd-${{ matrix.target }}
          path: |
            target/release-artifacts/devd-*.tar.gz
            target/release-artifacts/devd-*.tar.gz.sha256
            target/release-artifacts/devd-*.zip
            target/release-artifacts/devd-*.zip.sha256
          if-no-files-found: error
