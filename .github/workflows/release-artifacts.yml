name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Validate source revision
        env:
          DEVD_RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$DEVD_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'revision must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Record source revision
        env:
          DEVD_RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          git rev-parse HEAD > REVISION
          test "$(cat REVISION)" = "$DEVD_RELEASE_REVISION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Test binary
        run: ./target/${{ matrix.target }}/release/devd --version > VERSION
      - name: Archive binary and license
        run: tar -czf 'devd-${{ matrix.target }}.tar.gz' -C target/${{ matrix.target }}/release devd -C "$GITHUB_WORKSPACE" LICENSE README.md README.zh-CN.md VERSION REVISION
      - name: Record checksum
        run: shasum -a 256 'devd-${{ matrix.target }}.tar.gz' > 'devd-${{ matrix.target }}.tar.gz.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: devd-${{ matrix.target }}
          path: |
            devd-*.tar.gz
            devd-*.tar.gz.sha256
          if-no-files-found: error
